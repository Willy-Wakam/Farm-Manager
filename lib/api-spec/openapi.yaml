              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Financement"
    post:
      operationId: createFinancement
      tags: [financement]
      summary: Créer un financement
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFinancementBody"
      responses:
        "201":
          description: Financement créé
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Financement"

  /financement/{id}:
    put:
      operationId: updateFinancement
